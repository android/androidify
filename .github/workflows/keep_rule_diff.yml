#
# Shows which R8 keep rules a PR adds, removes or changes compared with main, like a GitHub diff.
# It doesn't build anything: a workflow that already runs a release build calls it, and hands over
# the keep rule .pb file that build wrote. See scripts/KEEP_RULE_DIFF.md.
name: R8 Keep Rule Diff

on:
  workflow_call:
    inputs:
      path:
        description: >-
          Path of the keep rule .pb file in the calling job, for example
          app/build/outputs/mapping/release/configanalyzer.pb. The calling job uploads that file
          as an artifact named r8-config-analyzer.
        required: true
        type: string
      skip-reason:
        description: >-
          If set on a pull request, no diff is made, and the report says it was skipped for this
          reason. main's .pb file is still saved on pushes.
        required: false
        type: string
        default: ''

jobs:
  keep-rule-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # create and update the report comment

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download the Keep Rule .pb File
      id: download
      # A missing .pb file (for example when the build failed) only skips the diff.
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: r8-config-analyzer
        path: ${{ runner.temp }}/r8-config-analyzer

    - name: Check the Keep Rule .pb File
      id: pb
      if: steps.download.outcome == 'success'
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        # The artifact holds the file under its own name, without the calling job's folders.
        PB_FILE="${RUNNER_TEMP}/r8-config-analyzer/$(basename "${INPUT_PATH}")"
        if [[ -f "${PB_FILE}" ]]; then
          echo "file=${PB_FILE}" >> "${GITHUB_OUTPUT}"
        else
          echo "::warning::The r8-config-analyzer artifact has no $(basename "${INPUT_PATH}")."
        fi

    - name: Find the Cache Key for main's Keep Rules
      id: key
      if: steps.pb.outputs.file != ''
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        # main's keep rules are cached per commit: this commit on main, or the commit the PR is
        # based on. Commits that only update r8-baseline.json (the R8 Regression Gate's bot commit)
        # don't change the build, so they are skipped.
        SHA="$(git log -1 --first-parent --format=%H "${BASE_SHA:-HEAD}" -- . ':(exclude)r8-baseline.json')"
        echo "rules_key=r8-rules-${SHA}" >> "${GITHUB_OUTPUT}"

    - name: Collect main's Keep Rules
      if: steps.pb.outputs.file != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      env:
        PB_FILE: ${{ steps.pb.outputs.file }}
      run: |
        mkdir -p r8-base
        cp "${PB_FILE}" r8-base/rules.pb

    - name: Save main's Keep Rules
      if: steps.pb.outputs.file != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: r8-base
        key: ${{ steps.key.outputs.rules_key }}

    - name: Write the Skipped Report
      id: skipped
      if: github.event_name == 'pull_request' && inputs.skip-reason != ''
      env:
        REASON: ${{ inputs.skip-reason }}
      run: |
        printf '%s\n' '<!-- keepdiff-report -->' '## 🔍 R8 keep rule diff' '' "⏭️ Skipped: ${REASON}." \
          > "${RUNNER_TEMP}/keep_rule_diff.md"
        cat "${RUNNER_TEMP}/keep_rule_diff.md" >> "${GITHUB_STEP_SUMMARY}"
        echo "report=${RUNNER_TEMP}/keep_rule_diff.md" >> "${GITHUB_OUTPUT}"

    - name: Restore main's Keep Rules
      id: base
      if: steps.pb.outputs.file != '' && github.event_name == 'pull_request' && inputs.skip-reason == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: r8-base
        key: ${{ steps.key.outputs.rules_key }}
        restore-keys: r8-rules-

    - name: Set up Python
      if: steps.pb.outputs.file != '' && github.event_name == 'pull_request' && inputs.skip-reason == ''
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Diff Keep Rules Against main
      id: diff
      if: steps.pb.outputs.file != '' && github.event_name == 'pull_request' && inputs.skip-reason == ''
      env:
        PB_FILE: ${{ steps.pb.outputs.file }}
        CACHE_HIT: ${{ steps.base.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.base.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        if [[ ! -f r8-base/rules.pb ]]; then
          echo "No keep rules from main in the cache yet, so there is nothing to compare against." | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        pip install --quiet 'protobuf>=6.33.4'
        python3 ./scripts/keep_rule_diff.py r8-base/rules.pb "${PB_FILE}" -o "${RUNNER_TEMP}/report.md"
        {
          head -n 2 "${RUNNER_TEMP}/report.md"
          if [[ "${CACHE_HIT}" != "true" ]]; then
            echo ""
            echo "> ⚠️ Compared against an older main build (\`${MATCHED_KEY#r8-rules-}\`), so some of these changes may come from main rather than this PR."
          fi
          tail -n +3 "${RUNNER_TEMP}/report.md"
        } > "${RUNNER_TEMP}/keep_rule_diff.md"
        cat "${RUNNER_TEMP}/keep_rule_diff.md" >> "${GITHUB_STEP_SUMMARY}"
        echo "report=${RUNNER_TEMP}/keep_rule_diff.md" >> "${GITHUB_OUTPUT}"
        # The report ends with "✅ No keep rules were added..." when nothing changed.
        if grep -q '^✅ No keep rules' "${RUNNER_TEMP}/keep_rule_diff.md"; then
          echo "changed=false" >> "${GITHUB_OUTPUT}"
        else
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Post or Update the PR Comment
      if: github.event_name == 'pull_request' && (steps.diff.outputs.report != '' || steps.skipped.outputs.report != '')
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.diff.outputs.report || steps.skipped.outputs.report }}
        CHANGED: ${{ steps.diff.outputs.changed || 'false' }}
      run: |
        set -euo pipefail
        # One comment per PR, found by the marker the report starts with. It is only created when a
        # keep rule changed; after that it is kept up to date, including "no changes" and "skipped".
        MARKER='<!-- keepdiff-report -->'
        COMMENTS="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
        COMMENT_ID="$(gh api "${COMMENTS}" --paginate \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | sed -n '1p')"
        if [[ -n "${COMMENT_ID}" ]]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@"${REPORT}" > /dev/null
        elif [[ "${CHANGED}" == "true" ]]; then
          gh api --method POST "${COMMENTS}" -F body=@"${REPORT}" > /dev/null
        fi
