repos:
  - repo: local
    hooks:
      - id: r8-keep-rules-diff-check
        name: R8 Keep Rules & FullMode Diff Check
        entry: scripts/git-hooks/pre-commit
        language: script
        pass_filenames: false
        files: '(\.pro$|gradle\.properties$|\.gradle\.kts$|libs\.versions\.toml$|r8-baseline\.json$)'
        stages: [pre-commit]

      - id: r8-regression-gate
        name: R8 Regression & Library Shrinking Gate (android analyze)
        entry: python3 scripts/check_r8_regression.py --scan-libraries --fail-on-package-wide-rules
        language: system
        pass_filenames: false
        files: '(\.pro$|gradle\.properties$|\.gradle\.kts$|libs\.versions\.toml$|r8-baseline\.json$)'
        stages: [pre-push]
